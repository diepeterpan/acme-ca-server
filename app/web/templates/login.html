{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block head %}
{{ super() }}
<style type="text/css">
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: var(--bg-page);
        padding: 2rem 1rem;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
    }

    .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: var(--radius-lg);
        box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.1), 0 8px 10px -6px rgba(124, 58, 237, 0.05);
        padding: 2.5rem 2rem;
        text-align: center;
    }

    .auth-icon-wrap {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--primary-light);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.12);
    }

    .auth-icon-wrap svg {
        width: 30px;
        height: 30px;
        fill: var(--primary);
    }

    .auth-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-heading);
        margin-bottom: 0.35rem;
        letter-spacing: -0.02em;
    }

    .auth-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.4;
        margin-bottom: 1.75rem;
    }

    .form-group {
        text-align: left;
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-heading);
        margin-bottom: 0.4rem;
    }

    .input-wrapper {
        position: relative;
    }

    .form-control {
        width: 100%;
        padding: 0.7rem 0.95rem;
        border: 1.5px solid #e2e8f0;
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        color: var(--text-body);
        background-color: #ffffff;
        transition: all 0.2s ease;
        outline: none;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .btn-toggle-pwd {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-toggle-pwd:hover {
        color: var(--primary);
    }

    .remember-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 1.25rem 0 1.5rem 0;
        font-size: 0.88rem;
    }

    .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-body);
        cursor: pointer;
        user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .btn-primary {
        width: 100%;
        padding: 0.8rem 1.25rem;
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
        transition: all 0.2s ease;
    }

    .btn-primary:hover {
        background-color: var(--primary-hover);
        box-shadow: 0 6px 14px rgba(124, 58, 237, 0.35);
        transform: translateY(-1px);
    }

    .btn-primary:active {
        transform: translateY(0);
    }

    .error-banner {
        background-color: var(--status-expired-bg);
        border: 1px solid var(--status-expired-border);
        color: var(--status-expired-text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.25rem;
        font-size: 0.88rem;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
</style>
{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="login-container">
    <div class="auth-card">
        <div class="auth-icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.54-3.08 8.8-7 9.88-3.92-1.08-7-5.34-7-9.88V6.3l7-3.12zM12 6a4 4 0 0 0-4 4c0 1.62.97 3.01 2.37 3.63L9.5 17h5l-.87-3.37A4 4 0 0 0 16 10a4 4 0 0 0-4-4zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
            </svg>
        </div>

        <div class="auth-header">
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">{{ app_title }}</div>
            <h1>Sign In</h1>
            <p>Sign in to manage certificates and CA settings.</p>
        </div>

        {% if error %}
        <div class="error-banner">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next|default('/') }}">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ username|default('') }}" required autofocus autocomplete="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="Enter your password">
                    <button type="button" class="btn-toggle-pwd" id="togglePassword" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="remember-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember_me" value="true">
                    <span>Remember this device</span>
                </label>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            pwdInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    });
</script>
{% endblock %}
